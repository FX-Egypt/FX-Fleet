<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>سيارات الشركة</title>
<style>
:root{--bg:#f4f6f8;--ink:#1f2933;--muted:#6b7785;--brand:#0f766e;--bad:#dc2626;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
header button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
button.primary{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:17px}
button.link{background:none;border:0;color:var(--brand);padding:8px 10px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .tile:last-child:nth-child(odd){grid-column:1/-1}
.ocr-st{font-size:14px;margin:8px 0 0;min-height:0;color:#475569;line-height:1.7}
.ocr-st.good{color:#166534}
.chip{background:#ecfeff;border:1.5px solid #0f766e;color:#0f766e;border-radius:8px;padding:2px 12px;font-size:16px;font-weight:700;font-family:inherit;margin:0 4px}
#odo.auto{border-color:#16a34a;background:#f0fdf4}
.lt-row{display:flex;gap:10px;align-items:stretch}
.lt-row input{flex:1;min-width:0}
.ppl{min-width:116px;background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:10px;padding:4px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.ppl b{font-size:16px;color:#0f766e}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 8px;text-align:center;font-size:18px}
.tile span{display:block;font-size:34px;margin-bottom:6px}
.alert{border-radius:12px;padding:14px;margin-bottom:14px;font-weight:600}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--bad);margin-top:10px;min-height:20px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos img,.thumb{width:100%;border-radius:8px;margin-top:6px}
.thumb{width:70px;margin:4px 4px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.info{background:#f0fdfa;border-radius:10px;padding:4px 12px;margin:8px 0}
/* ===== شاشة الدخول ===== */
body.auth{background:linear-gradient(165deg,#0a4f49 0%,#0f766e 48%,#14918a 100%);background-attachment:fixed;min-height:100vh}
body.auth header{display:none}
body.auth main{max-width:none;padding:0}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px;max-width:440px;margin:0 auto}
.brand{text-align:center;color:#fff;margin-bottom:26px}
.logo{width:88px;height:88px;margin:0 auto 16px;border-radius:26px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo svg{width:50px;height:50px}
.logo-badge{display:inline-block;background:#fff;border-radius:22px;padding:14px 20px;margin:0 auto 16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.logo-badge img{display:block;max-width:100%;width:230px;max-height:90px;object-fit:contain}
.logo-prev{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;margin:6px 0}
.logo-prev img{max-width:100%;max-height:90px;object-fit:contain}
.okmsg{font-size:14px;margin-top:10px;min-height:20px;color:#166534}
.brand h1{font-size:26px;margin:0 0 6px;letter-spacing:.2px}
.brand p{margin:0;opacity:.82;font-size:14.5px}
.auth-card{background:#fff;border-radius:22px;padding:26px 22px 22px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.auth-card h2{margin:0 0 4px;font-size:19px}
.auth-card .sub{margin:0 0 6px;color:var(--muted);font-size:13.5px}
.field{position:relative;margin-top:16px}
.field label{margin:0 0 6px;font-size:13.5px;color:#475569;font-weight:600}
.field input{height:52px;padding:0 46px;font-size:16px;background:#f8fafc;border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s,background .15s}
.field input:focus{outline:0;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.14)}
.field .ico{position:absolute;inset-inline-start:14px;bottom:15px;width:22px;height:22px;color:#94a3b8;pointer-events:none}
.field input:focus ~ .ico{color:var(--brand)}
.field .eye{position:absolute;inset-inline-end:6px;bottom:6px;width:40px;height:40px;border:0;background:none;color:#94a3b8;border-radius:10px;display:grid;place-items:center;padding:0}
.field .eye svg{width:22px;height:22px}
.auth-card .btn-main{width:100%;height:52px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(180deg,#14918a,#0f766e);color:#fff;font-size:17px;font-weight:700;font-family:inherit;box-shadow:0 8px 18px rgba(15,118,110,.35);transition:transform .08s,box-shadow .15s}
.auth-card .btn-main:active{transform:translateY(1px);box-shadow:0 4px 10px rgba(15,118,110,.35)}
.auth-card .err{text-align:center;font-size:14px;margin-top:14px;min-height:0}
.auth-card .err:not(:empty){background:#fef2f2;border-radius:10px;padding:10px 12px;animation:shake .35s}
.auth-card .err[style*="166534"]:not(:empty){background:#f0fdf4}
@keyframes shake{20%{transform:translateX(6px)}40%{transform:translateX(-6px)}60%{transform:translateX(4px)}80%{transform:translateX(-3px)}}
.auth-links{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px}
.auth-links button{background:none;border:0;color:#d1fae5;font-size:14.5px;padding:8px 12px;font-family:inherit;border-radius:8px}
.auth-links button:active{background:rgba(255,255,255,.12)}
.auth-note{text-align:center;color:rgba(255,255,255,.65);font-size:12.5px;margin-top:10px}
</style>
</head>

/* آخر قراءة عداد مسجلة في أي شاشة (وقود / زيت / كاوتش) */
/* السجلات المحذوفة تبقى كعلامة حذف (حتى تنتقل بين الأجهزة) لكنها لا تدخل في أي حساب */
const live=c=>c.logs.filter(l=>!l.del);
/* العداد الحالي وآخر تغيير زيت يُحسبان دائمًا من السجلات (حتى يظهر أثر التصحيح) */
function recalc(c){let cur=Math.max(c.startOdo||0,c.baseOdo||0),oil=Math.max(c.startOdo||0,c.baseOil||0);
  for(const l of live(c))if(l.odo>0){cur=Math.max(cur,l.odo);if(l.kind==="oil")oil=Math.max(oil,l.odo)}
  c.curOdo=cur;c.lastOil=oil}
function migrate(c){if(c.baseOdo!==undefined)return;let mx=c.startOdo||0,mo=c.startOdo||0;
  for(const l of live(c))if(l.odo>0){mx=Math.max(mx,l.odo);if(l.kind==="oil")mo=Math.max(mo,l.odo)}
  c.baseOdo=(c.curOdo||0)>mx?c.curOdo:0;c.baseOil=(c.lastOil||0)>mo?c.lastOil:0}
const getLatestOdometerAnywhere=c=>Math.max(c.startOdo||0,c.curOdo||0,...live(c).map(l=>l.odo||0));
const byOdo=(c,kind)=>live(c).filter(l=>l.kind===kind&&l.odo>0).sort((a,b)=>a.odo-b.odo||a.date.localeCompare(b.date));
const lastOf=(c,kind)=>{const a=byOdo(c,kind);return a[a.length-1]||null};
const oilLeft=c=>OIL_KM-(getLatestOdometerAnywhere(c)-(c.lastOil||0));
/* متوسط الاستهلاك كم/لتر: المسافة بين تعبئتين ÷ لترات التعبئة اللاحقة */
function fuelStats(c){const a=byOdo(c,"fuel");let km=0,lt=0,last=null;
  for(let i=1;i<a.length;i++){const d=a[i].odo-a[i-1].odo;if(a[i].liters>0&&d>0){km+=d;lt+=a[i].liters;last=d/a[i].liters}}
  return{avg:lt>0?km/lt:null,last}}
function alertsFor(c){const out=[],now=getLatestOdometerAnywhere(c),left=oilLeft(c);
  if(left<=0)out.push(["bad",`🚨 الزيت تجاوز موعد التغيير (${fmt(-left)} كم زيادة)`]);
  else if(left<=WARN_KM)out.push(["warn",`🔔 الزيت يقترب من موعد التغيير (متبقي ${fmt(left)} كم)`]);
  else out.push(["ok",`🛢️ متبقي ${fmt(left)} كم على غيار الزيت`]);
  const t=lastOf(c,"tires");
  if(t){const used=now-t.odo,rest=TIRE_KM-used;
    if(rest<0)out.push(["bad",`🚨 الإطارات تجاوزت العمر الافتراضي (${fmt(-rest)} كم زيادة)`]);
    else if(rest<=TIRE_WARN_KM)out.push(["warn",`🔔 الإطارات تقترب من نهاية عمرها (متبقي ${fmt(rest)} كم)`]);
    else out.push(["ok",`🛞 الإطارات قطعت ${fmt(used)} كم منذ الشراء`])}
  return out}
function recRows(c,k){
  const all=live(c).filter(l=>l.kind===k).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  const fa=k==="fuel"?byOdo(c,"fuel"):null;
  return all.slice(0,10).map(l=>{const ex=[];
    if(l.odo)ex.push(fmt(l.odo)+" كم");
    if(k==="fuel"){const i=fa.indexOf(l);if(i>0){const d=l.odo-fa[i-1].odo;if(d>0){ex.push("قطع "+fmt(d)+" كم");if(l.liters>0)ex.push((d/l.liters).toFixed(1)+" كم/لتر")}}
      if(l.liters){ex.push(l.liters+" لتر");ex.push((l.amount/l.liters).toFixed(2)+" ج/لتر")}}
    if(l.count)ex.push(l.count+" كاوتش");if(l.note)ex.push(l.note);
    return`<div class="row"><span>${esc(ex.join(" • "))}</span><span>${fmt(l.amount)} ج<br><span class="muted">${esc(l.date)}</span></span></div>`}).join("")||"<p class='muted'>لا توجد سجلات سابقة</p>"}

/* ---------- التخزين على الجهاز (IndexedDB) ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("cars-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get("db");q.onsuccess=()=>res(q.result||{cars:[],admin:null});q.onerror=()=>res({cars:[],admin:null})})}catch{return{cars:[],admin:null}}}
async function save(){try{const d=await idb();await new Promise(res=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(DB,"db");t.oncomplete=res;t.onerror=res})}catch{}}

async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("cars:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{let h=5381;for(const c of "cars:"+s)h=(h*33)^c.charCodeAt(0);return"x"+(h>>>0).toString(36)}}

/* تجهيز الشعار: تصغير + خلفية بيضاء */
async function prepLogo(file){const b=await createImageBitmap(file),sc=Math.min(1,600/b.width,240/b.height),cv=document.createElement("canvas");
  cv.width=Math.max(1,Math.round(b.width*sc));cv.height=Math.max(1,Math.round(b.height*sc));
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(b,0,0,cv.width,cv.height);
  let u=cv.toDataURL("image/png");if(u.length>250000)u=cv.toDataURL("image/jpeg",.85);return u}

/* ---------- عرض مباشر: المسافة المقطوعة والاستهلاك ---------- */
function updateLive(){
  if(S.view!=="form"||S.kind!=="fuel")return;const dEl=$("#liveDist"),cEl=$("#liveCons");if(!dEl)return;
  {const A=toNum(val("amount")),Lt=toNum(val("liters")),pe=$("#livePPL");if(pe)pe.textContent=(A>0&&Lt>0)?(A/Lt).toFixed(2)+" ج":"—"}
  const c=car(),now=getLatestOdometerAnywhere(c),odo=toNum(val("odo")),L=toNum(val("liters"));
  if(!(odo>0)){dEl.textContent="—";cEl.textContent="—";return}
  const d=odo-now;dEl.textContent=d<0?"القراءة أقل من آخر قراءة!":fmt(d)+" كم";dEl.style.color=d<0?"#dc2626":"";
  const pf=lastOf(c,"fuel"),fd=pf?odo-pf.odo:0;
  cEl.textContent=(fd>0&&L>0)?(fd/L).toFixed(1)+" كم/لتر":"—"}
document.addEventListener("input",e=>{if(e.target.id==="odo"||e.target.id==="liters"||e.target.id==="amount")updateLive()});

/* ---------- الصور وقراءة الأرقام ---------- */
async function compress(file){const b=await createImageBitmap(file),s=Math.min(1,640/b.width),cv=document.createElement("canvas");
  cv.width=Math.round(b.width*s);cv.height=Math.round(b.height*s);cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",.55)}
/* ---------- قراءة رقم العداد من الصورة (OCR) ---------- */
let tessLoad=null,tessWP=null;
function loadTess(){return window.Tesseract?Promise.resolve(window.Tesseract):(tessLoad||(tessLoad=new Promise((ok,no)=>{
  const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  sc.onload=()=>ok(window.Tesseract);sc.onerror=()=>{tessLoad=null;no(new Error("load"))};document.head.appendChild(sc)})))}
function getWorker(){return tessWP||(tessWP=(async()=>{const T=await loadTess(),w=await T.createWorker("eng");
  await w.setParameters({tessedit_char_whitelist:"0123456789.",tessedit_pageseg_mode:"11"});return w})().catch(e=>{tessWP=null;throw e}))}
/* تجهيز الصورة: تصغير + تدرج رمادي + تباين تلقائي (وعكس الألوان عند الحاجة للأرقام الفاتحة على خلفية داكنة) */
async function ocrCanvas(file,invert){const b=await createImageBitmap(file),sc=Math.min(1,1400/Math.max(b.width,b.height)),cv=document.createElement("canvas");
  cv.width=Math.round(b.width*sc);cv.height=Math.round(b.height*sc);const g=cv.getContext("2d");g.drawImage(b,0,0,cv.width,cv.height);
  const im=g.getImageData(0,0,cv.width,cv.height),d=im.data,n=cv.width*cv.height,h=new Uint32Array(256);
  for(let i=0;i<n;i++){const y=(d[4*i]*299+d[4*i+1]*587+d[4*i+2]*114)/1000|0;d[4*i]=y;h[y]++}
  let c=0,lo=0,hi=255;for(let v=0;v<256;v++){c+=h[v];if(c>=n*.02){lo=v;break}}c=0;for(let v=255;v>=0;v--){c+=h[v];if(c>=n*.02){hi=v;break}}
  const span=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){let y=Math.max(0,Math.min(255,(d[4*i]-lo)*255/span));if(invert)y=255-y;d[4*i]=d[4*i+1]=d[4*i+2]=y;d[4*i+3]=255}
  g.putImageData(im,0,0);return cv}
/* اختيار رقم العداد من الكلمات المقروءة: 3–7 خانات، لا يقل عن آخر قراءة ولا يزيد عنها بأكثر من 15000 كم، الأكبر حجمًا أولًا */
const ODO_MAX_JUMP=15000;
function odoCandidates(words,now){const out=[];
  for(const w of words){const t=String(w.text||"").replace(/[^0-9.]/g,""),m=t.match(/^(\d{3,7})(\.\d+)?$/);if(!m)continue;
    const v=+m[1],ok=v>=now&&(now>0?v<=now+ODO_MAX_JUMP:true);if(!ok)continue;
    out.push({v,dec:m[2]?1:0,h:w.bbox?Math.abs(w.bbox.y1-w.bbox.y0):0,conf:w.confidence||0})}
  return out.sort((a,b)=>a.dec-b.dec||b.h-a.h||b.conf-a.conf)}
async function readOdometer(file){const w=await getWorker(),now=getLatestOdometerAnywhere(car());
  for(const inv of [false,true]){const {data}=await w.recognize(await ocrCanvas(file,inv));
    const words=(data.words&&data.words.length)?data.words:(String(data.text||"").match(/\d+(\.\d+)?/g)||[]).map(t=>({text:t,confidence:0}));
    const c=odoCandidates(words,now);if(c.length)return c}
  return[]}
function fillOdo(v){const el=$("#odo");if(!el)return;el.value=v;el.classList.add("auto");updateLive()}
async function ocrOdo(file){const st=$("#ocr");if(!st)return;st.className="ocr-st";
  if(!navigator.onLine){st.textContent="القراءة التلقائية تحتاج إنترنت، اكتب الرقم يدويًا";return}
  st.textContent="جاري قراءة العداد… (أول مرة قد تستغرق وقتًا أطول)";
  try{const c=await readOdometer(file);if(S.view!=="form"||!$("#ocr"))return;const top=c[0],now=getLatestOdometerAnywhere(car());
    if(top&&top.conf>=75){fillOdo(top.v);st.className="ocr-st good";st.innerHTML="✓ تمت قراءة العداد: <b>"+fmt(top.v)+"</b> — راجع الرقم قبل الحفظ"}
    else if(top&&top.conf>=35)st.innerHTML=`الصورة غير واضحة تمامًا. هل القراءة <button type="button" class="chip" data-act="useOdo" data-v="${top.v}">${fmt(top.v)}</button>؟ أو اكتبها يدويًا`;
    else st.textContent="لم أستطع قراءة العداد بوضوح (يجب أن يكون الرقم "+fmt(now)+" أو أكبر). صوّر من قريب وبإضاءة جيدة أو اكتبه يدويًا"}
  catch{if($("#ocr"))$("#ocr").textContent="تعذرت القراءة التلقائية (تحتاج إنترنت). اكتب الرقم يدويًا"}}

const dig=v=>String(v??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
const HDR={plate:["اللوحة","رقم اللوحة"],type:["النوع","نوع السيارة"],driver:["اسم السائق","السائق"],year:["سنة الموديل","الموديل"],chassis:["رقم الشاسيه","الشاسيه"],exp:["تاريخ انتهاء الرخصة","انتهاء الرخصة"],odo:["عداد البداية","العداد"],pass:["الباسورد","باسورد","كلمة السر"]};
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function parseCSV(t){t=t.replace(/^﻿/,"");const first=t.split("\n")[0];
  const d=[",",";","\t"].map(x=>[x,first.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}return rows}
function isoDate(v){v=dig(v);let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""}
async function importCars(rows){
  rows=rows.filter(r=>r.some(c=>String(c??"").trim()));if(rows.length<2)return"الملف فارغ";
  const head=rows[0].map(h=>String(h??"").trim()),col={};
  for(const k in HDR)col[k]=head.findIndex(h=>HDR[k].includes(h));
  if(col.plate<0||col.type<0)return"لم أجد عمودي «اللوحة» و«النوع» في الصف الأول";
  let added=0,updated=0;const bad=[];
  for(let i=1;i<rows.length;i++){
    const g=k=>col[k]<0?"":String(rows[i][col[k]]??"").trim();
    const plate=g("plate"),type=g("type");if(!plate||!type){bad.push(i+1);continue}
    const year=dig(g("year")),odoTxt=dig(g("odo")),exp=isoDate(g("exp")),chassis=g("chassis"),pass=g("pass"),driver=g("driver");
    const e=DB.cars.find(c=>c.key===plateKey(plate));
    if(e){e.type=type;if(driver)e.driver=driver;if(year)e.year=year;if(chassis)e.chassis=chassis;if(exp)e.licExp=exp;
      if(odoTxt!==""){e.startOdo=toNum(odoTxt)||0;recalc(e)}
      if(pass){if(pass.length<4){bad.push(i+1);continue}e.pass=await hash(pass)}
      updated++}
    else{if(pass.length<4){bad.push(i+1);continue}
      const odo=toNum(odoTxt)||0;
      DB.cars.push({id:uid(),key:plateKey(plate),plate,type,driver,year,chassis,licExp:exp,startOdo:odo,curOdo:odo,lastOil:odo,pass:await hash(pass),logs:[]});added++}}
  await save();
  return`تمت إضافة ${added} سيارة وتحديث ${updated}`+(bad.length?`\nتم تخطي الصفوف: ${bad.join("، ")} (بيانات ناقصة أو الباسورد أقل من 4 أحرف)`:"")}

async function sendFile(name,text,type){const f=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;a.click()}
const strip=c=>({...c,logs:c.logs});
function csv(cars){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const r=[["اللوحة","السائق","النوع","الموديل","العملية","التاريخ","العداد","المبلغ","العدد","البيان","لترات","سعر اللتر"]];
  cars.forEach(c=>live(c).sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>r.push([c.plate,c.driver||"",c.type,c.year||"",KINDS[l.kind],l.date,l.odo||"",l.amount,l.count||"",l.note||"",l.liters||"",l.liters?+(l.amount/l.liters).toFixed(2):""])));
  return"﻿"+r.map(x=>x.map(q).join(",")).join("\n")}
function merge(inc){let n=0;for(const c of inc.cars||[]){const m=DB.cars.find(x=>x.key===c.key);
  if(!m){c.logs=c.logs||[];migrate(c);DB.cars.push(c);recalc(c);n+=live(c).length;continue}
  const by=new Map(m.logs.map(l=>[l.id,l]));
  for(const l of c.logs||[]){const x=by.get(l.id);
    if(!x){m.logs.push(l);n++}
    else if((l.rev||0)>(x.rev||0)){m.logs[m.logs.indexOf(x)]=l;n++}}   // نسخة أحدث (تصحيح أو حذف)
  recalc(m)}
  if(!DB.admin&&inc.admin)DB.admin=inc.admin;
  if(inc.fromAdmin&&inc.brand&&(inc.brand.name||inc.brand.logo)&&JSON.stringify(inc.brand)!==JSON.stringify(DB.brand||null)){DB.brand=inc.brand;n++}
  return n}

async function flush(){
  if(!DB.sync?.url||!navigator.onLine||flushing)return 0;flushing=true;let n=0;
  try{for(const c of DB.cars)for(const l of c.logs){if(l.synced)continue;
    const r=await fetch(DB.sync.url,{method:"POST",body:JSON.stringify({secret:DB.sync.secret,id:l.id,plate:c.plate,type:c.type,driver:c.driver||"",
      kind:SHEET_KIND[l.kind]||KINDS[l.kind],date:l.date,odo:l.odo||"",amount:l.amount,count:l.count||"",liters:l.liters||"",note:l.note||"",rev:l.rev||0,del:!!l.del,photoCar:(l.upd||l.del)?"":(l.photoCar||""),photoPump:(l.upd||l.del)?"":(l.photoPump||"")})});
    const j=await r.json();if(!j.ok)break;l.synced=true;n++}}
  catch{}
  flushing=false;if(n)await save();return n}
window.addEventListener("online",()=>flush().then(n=>{if(n&&S.view==="home")render()}));

/* فتح رابط السائق: يجهّز السيارة على هذا الجهاز تلقائيًا */
async function applyCarLink(c){
  if(!c||!c.key||!c.plate||!c.pass)throw 0;
  if(c.sync&&c.sync.url)DB.sync=c.sync;delete c.sync;
  if(c.brand&&c.brand.name)DB.brand={...(DB.brand||{}),name:c.brand.name};delete c.brand;
  const e=DB.cars.find(x=>x.key===c.key);
  if(e){Object.assign(e,{plate:c.plate,type:c.type,driver:c.driver||e.driver||"",year:c.year,chassis:c.chassis,licExp:c.licExp,startOdo:c.startOdo,pass:c.pass});
    e.baseOdo=c.curOdo||0;e.baseOil=c.lastOil||0;recalc(e)}
  else{const n={...c,id:uid(),logs:[],baseOdo:c.curOdo||0,baseOil:c.lastOil||0};recalc(n);DB.cars.push(n)}
  await save()}
load().then(async d=>{DB=d;DB.cars.forEach(migrate);
  const m=location.hash.match(/^#car=(.+)$/);
  if(m){try{const c=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
      await applyCarLink(c);S.msg="تم تجهيز السيارة "+c.plate+" — ادخل برقم اللوحة والباسورد";S.good=true;
      history.replaceState(null,"",location.pathname+location.search)}
    catch{S.msg="الرابط غير صالح، اطلب رابطًا جديدًا من الإدارة"}}
  render();
  flush().then(n=>{if(n&&S.view==="home")render()})});
</script>
